services:
  - type: web
    name: moscow-shelters
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_shelters.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
