[build]
  publish = "static"

[functions]
  directory = "netlify/functions"

# Public API now runs as a Netlify Function and talks directly to Neon.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Pretty animal/shelter URLs stay static, while the ID is passed to the page.
[[redirects]]
  from = "/animals/*"
  to = "/animal.html?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/shelters/*"
  to = "/shelter.html?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
