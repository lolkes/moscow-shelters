name: Import production project

on: push

permissions:
  contents: write

jobs:
  import:
    if: ${{ hashFiles('_project_chunk_*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files
        run: |
          python - <<'PY'
          import base64, zipfile, glob
          from pathlib import Path
          chunks = sorted(glob.glob('_project_chunk_*'))
          payload = ''.join(Path(p).read_text() for p in chunks)
          Path('/tmp/project.zip').write_bytes(base64.b64decode(payload))
          with zipfile.ZipFile('/tmp/project.zip') as z:
              z.extractall('/tmp/project')
          root = Path('/tmp/project')
          for p in root.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel = p.relative_to(root)
                  dst = Path(rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(p.read_bytes())
          for p in chunks:
              Path(p).unlink()
          PY
      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Upload complete production project'
          git push
