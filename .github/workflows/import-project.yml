name: Import production project

on: push

permissions:
  contents: write

jobs:
  import:
    if: ${{ hashFiles('moscow_shelters_PRODUCTION_no_telegram.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files from ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          zpath = Path('moscow_shelters_PRODUCTION_no_telegram.zip')
          out = Path('/tmp/project')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              z.extractall(out)
          root = out
          for p in root.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel = p.relative_to(root)
                  dst = Path(rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(p.read_bytes())
          zpath.unlink()
          Path('_project_chunk_aa').unlink(missing_ok=True)
          PY
      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Upload complete production project'
          git push
