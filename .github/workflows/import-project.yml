name: Import production project

on:
  push:
    paths:
      - '_project_payload.b64'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project files
        run: |
          python - <<'PY'
          import base64, zipfile
          from pathlib import Path
          payload = Path('_project_payload.b64')
          data = base64.b64decode(payload.read_text())
          Path('/tmp/project.zip').write_bytes(data)
          with zipfile.ZipFile('/tmp/project.zip') as z:
              z.extractall('/tmp/project')
          root = Path('/tmp/project')
          for p in root.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel = p.relative_to(root)
                  dst = Path(rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(p.read_bytes())
          payload.unlink()
          PY

      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Upload complete production project'
          git push
