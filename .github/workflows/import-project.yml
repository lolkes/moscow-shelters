name: Import production project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project is already imported
        run: |
          test -f app/main.py
          test -f requirements.txt
          test -f render.yaml
          test -f static/index.html
          echo 'Production project is already in the repository.'
