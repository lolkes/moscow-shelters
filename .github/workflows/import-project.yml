name: Import production project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files from ZIP
        run: |
          test -f moscow_shelters_PRODUCTION_no_telegram.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          python - <<'PY'
          import zipfile
          from pathlib import Path
          zpath = Path('moscow_shelters_PRODUCTION_no_telegram.zip')
          with zipfile.ZipFile(zpath) as z:
              z.extractall('/tmp/project')
          root = Path('/tmp/project')
          dirs = [p for p in root.iterdir() if p.is_dir()]
          if len(dirs) == 1 and not (root / 'app').exists():
              root = dirs[0]
          for p in root.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel = p.relative_to(root)
                  if rel.as_posix().startswith('.github/workflows/'):
                      continue
                  dst = Path(rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(p.read_bytes())
          zpath.unlink()
          for p in Path('.').glob('_project_chunk_*'):
              p.unlink()
          PY
      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No project changes to commit.'
            exit 0
          fi
          git commit -m 'Import production project files'
          git pull --rebase origin main
          git push origin HEAD:main
