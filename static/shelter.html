<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b32"><title>Приют — Дом для хвоста</title><link rel="stylesheet" href="/style.css"></head><body><header class="simple"><div class="wrap nav"><a class="brand" href="/">🐾 Дом для хвоста</a><a href="/">← Каталог</a></div></header><main class="wrap detail"><div id="shelter"><div class="loading"><span></span><span></span><span></span></div></div><div class="section-head"><h2>Животные</h2><select id="species"><option value="">Все</option><option value="cat">Кошки</option><option value="dog">Собаки</option></select></div><div id="animals" class="animal-grid"></div></main><script>
const ID=decodeURIComponent(new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop()||'');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const icon=s=>s==='cat'?'🐱':s==='dog'?'🐶':'🐾';
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
async function getJSON(url){const r=await fetch(url,{headers:{Accept:'application/json'}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||d.error||('HTTP '+r.status));return d}
function card(x){const p=Array.isArray(x.photos)?x.photos.filter(Boolean):[];return '<article class="animal-card">'+(p.length?'<div class="animal-photo-wrap"><img class="animal-photo" src="'+esc(p[0])+'" alt="'+esc(x.name||'Животное')+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class="photo-error">'+icon(x.species)+'</div>\'"></div>':'<div class="animal-icon">'+icon(x.species)+'</div>')+'<div class="animal-card-body"><div class="type-pill">'+icon(x.species)+' '+(x.species==='cat'?'Кошка':x.species==='dog'?'Собака':'Животное')+'</div><h3>'+esc(x.name||'Без имени')+'</h3><div class="muted">'+esc(x.age||'Возраст не указан')+' · '+(x.sex==='male'?'мальчик':x.sex==='female'?'девочка':'пол не указан')+'</div><p>'+esc(clean(x.description).slice(0,180)+(clean(x.description).length>180?'…':''))+'</p><a class="button small" href="/animals/'+encodeURIComponent(x.id)+'">Подробнее</a></div></article>'}
async function load(){try{const s=await getJSON('/api/shelters/'+encodeURIComponent(ID));document.title=(s.name||'Приют')+' — Дом для хвоста';document.querySelector('#shelter').innerHTML='<div class="eyebrow">ПРИЮТ</div><h1>'+esc(s.name||'Приют')+'</h1><p class="lead">'+esc(s.description||'Информация об источнике и животных приюта.')+'</p><div class="meta"><span>📍 '+esc(s.city||s.region||'Москва и МО')+'</span><span class="badge '+(s.verified?'ok':'warn')+'">'+(s.verified?'Источник проверен':'Источник не проверен')+'</span></div>'+(s.website?'<a class="button" target="_blank" rel="noopener noreferrer" href="'+esc(s.website)+'">Сайт приюта ↗</a>':'');await render()}catch(e){console.error(e);document.querySelector('#shelter').innerHTML='<div class="empty error-box">Приют не найден или временно недоступен.<br><a href="/">Вернуться в каталог</a></div>'}}
async function render(){try{const sp=document.querySelector('#species').value;const a=await getJSON('/api/shelters/'+encodeURIComponent(ID)+'/animals'+(sp?'?species='+sp:''));document.querySelector('#animals').innerHTML=(Array.isArray(a)?a:[]).map(card).join('')||'<div class="empty">Сейчас активных анкет нет.</div>'}catch(e){console.error(e);document.querySelector('#animals').innerHTML='<div class="empty error-box">Не удалось загрузить анкеты.</div>'}}
document.querySelector('#species').onchange=render;load();
</script></body></html>
