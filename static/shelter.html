<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приют</title><link rel="stylesheet" href="/style.css"></head><body><header class="simple"><div class="wrap nav"><a class="brand" href="/">🐾 Дом для хвоста</a><a href="/">← Каталог</a></div></header><main class="wrap detail"><div id="shelter"></div><div class="section-head"><h2>Животные</h2><select id="species"><option value="">Все</option><option value="cat">Кошки</option><option value="dog">Собаки</option><option value="other">Другие</option></select></div><div id="animals" class="animal-grid"></div></main><script>const ID=decodeURIComponent(new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop()||'');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const icon=s=>s==='cat'?'🐱':s==='dog'?'🐶':'🐾';async function load(){const s=await fetch('/api/shelters/'+encodeURIComponent(ID)).then(r=>r.json());document.title=s.name;document.querySelector('#shelter').innerHTML=`<div class="eyebrow">Приют</div><h1>${esc(s.name)}</h1><p class="lead">${esc(s.description||'')}</p><div class="meta"><span>📍 ${esc(s.city||s.region)}</span><span>🐾 ${s.animal_count||0} активных</span><span class="badge ${s.verified?'ok':'warn'}">${s.verified?'Источник проверен':'Требует проверки'}</span></div>${s.website?`<a class="button" target="_blank" rel="noopener" href="${esc(s.website)}">Сайт приюта ↗</a>`:''}`;render()}async function render(){let sp=document.querySelector('#species').value;let a=await fetch('/api/shelters/'+encodeURIComponent(ID)+'/animals'+(sp?'?species='+sp:'')).then(r=>r.json());document.querySelector('#animals').innerHTML=a.map(x=>`<article class="animal-card">${(x.photos&&x.photos.length)?`<div class="animal-photo-wrap"><img class="animal-photo" src="${esc(x.photos[0])}" alt="${esc(x.name)}" loading="lazy" referrerpolicy="no-referrer"><div class="photo-fallback">${icon(x.species)}</div></div>`:`<div class="animal-icon">${icon(x.species)}</div>`}<div class="animal-card-body"><h3>${esc(x.name)}</h3><div class="muted">${esc(x.age||'Возраст не указан')} · ${x.sex==='male'?'мальчик':x.sex==='female'?'девочка':'пол не указан'}</div><p>${esc((x.description||'').slice(0,180))}</p><a class="button small" href="/animals/${x.id}">Подробнее</a></div></article>`).join('')||'<div class="empty">Сейчас активных объявлений нет.</div>'}document.querySelector('#species').onchange=render;load();</script></body></html>
