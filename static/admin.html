<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Состояние системы</title><link rel="stylesheet" href="/style.css"></head><body><header class="simple"><div class="wrap nav"><a class="brand" href="/">🐾 Дом для хвоста</a><a href="/">← Каталог</a></div></header><main class="wrap detail"><div class="eyebrow">Мониторинг</div><h1>Система работает автоматически</h1><p class="lead">Здесь нет ручного включения источников. Система сама проверяет доступные разрешённые feeds и обновляет каталог раз в час.</p><div id="system" class="monitor-grid"></div><h2>Последние циклы</h2><div id="runs" class="run-list"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){let [s,r,m]=await Promise.all([fetch('/api/system').then(x=>x.json()),fetch('/api/import/status?limit=30').then(x=>x.json()),fetch('/api/metrics').then(x=>x.json())]);document.querySelector('#system').innerHTML=`<div class="monitor"><b>Версия</b><strong>${esc(s.version)}</strong></div><div class="monitor"><b>Цикл</b><strong>Каждый час</strong></div><div class="monitor"><b>Последний импорт</b><strong>${s.last_import?new Date(s.last_import).toLocaleString('ru-RU'):'ещё не запускался'}</strong></div><div class="monitor"><b>Ошибки за 24ч</b><strong>${s.errors_24h}</strong></div><div class="monitor"><b>Животных</b><strong>${m.active_animals}</strong></div><div class="monitor"><b>Источников с ошибками</b><strong>${m.sources_with_failures}</strong></div>`;document.querySelector('#runs').innerHTML=r.map(x=>`<div class="run"><span>${new Date(x.started_at).toLocaleString('ru-RU')}</span><b>${esc(x.status)}</b><span>${x.imported} новых · ${x.updated} обновлено</span><small>${esc(x.error||x.source_url||'')}</small></div>`).join('')||'<div class="empty">Циклов пока не было.</div>'}load();setInterval(load,60000);</script></body></html>
