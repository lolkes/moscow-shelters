<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Животное</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="simple"><div class="wrap nav"><a class="brand" href="/">🐾 Дом для хвоста</a><a href="/">← Каталог</a></div></header><main class="wrap detail" id="page"></main><script>
const ID=decodeURIComponent(new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop()||'');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const species=s=>s==='cat'?'Кошка':s==='dog'?'Собака':'Другое животное';const sex=s=>s==='male'?'Мальчик':s==='female'?'Девочка':'Пол не указан';
function gallery(a){const p=(a.photos||[]).filter(Boolean);if(!p.length)return `<div class="big-icon">${a.species==='cat'?'🐱':a.species==='dog'?'🐶':'🐾'}</div>`;return `<div class="detail-gallery"><div class="main-photo"><img id="mainPhoto" src="${esc(p[0])}" alt="${esc(a.name)}" referrerpolicy="no-referrer"><div class="photo-fallback">${a.species==='cat'?'🐱':a.species==='dog'?'🐶':'🐾'}</div></div>${p.length>1?`<div class="photo-grid">${p.map((x,i)=>`<button type="button" class="thumb ${i===0?'active':''}" data-src="${esc(x)}"><img src="${esc(x)}" alt="Фото ${i+1}" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div>`:''}</div>`}
fetch('/api/animals/'+ID).then(r=>r.json()).then(d=>{let a=d.animal,s=d.shelter;document.title=a.name+' — Дом для хвоста';document.querySelector('#page').innerHTML=`<div class="animal-detail">${gallery(a)}<div><div class="eyebrow">Ищет дом</div><h1>${esc(a.name)}</h1><div class="chips"><span>${species(a.species)}</span><span>${esc(a.age||'Возраст не указан')}</span><span>${sex(a.sex)}</span>${a.breed?`<span>${esc(a.breed)}</span>`:''}${a.size?`<span>${a.size==='small'?'Маленький':a.size==='medium'?'Средний':a.size==='large'?'Крупный':esc(a.size)}</span>`:''}${a.color?`<span>${esc(a.color)}</span>`:''}${a.sterilized===true?'<span>Стерилизован(а)</span>':''}${a.vaccinated===true?'<span>Привит(а)</span>':''}</div><p class="lead">${esc(a.description||'Описание отсутствует в источнике.')}</p><div class="source-box"><b>🏠 Приют</b><a href="/shelters/${encodeURIComponent(s.id)}">${esc(s.name)}</a><span>${esc(s.city||s.region)}</span></div><a class="button" target="_blank" rel="noopener" href="${esc(a.original_url)}">Оригинальное объявление ↗</a></div></div>`;document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.querySelector('#mainPhoto').src=b.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}).catch(()=>document.querySelector('#page').innerHTML='<div class="empty">Не удалось загрузить объявление.</div>');</script></body></html>
