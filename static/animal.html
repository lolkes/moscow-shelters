<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b32"><title>Животное — Дом для хвоста</title><link rel="stylesheet" href="/style.css"></head><body><header class="simple"><div class="wrap nav"><a class="brand" href="/">🐾 Дом для хвоста</a><a href="/">← Каталог</a></div></header><main class="wrap detail" id="page"><div class="loading"><span></span><span></span><span></span></div></main><script>
const ID=decodeURIComponent(new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop()||'');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const species=s=>s==='cat'?'Кошка':s==='dog'?'Собака':'Другое животное';
const sex=s=>s==='male'?'Мальчик':s==='female'?'Девочка':'Пол не указан';
const icon=s=>s==='cat'?'🐱':s==='dog'?'🐶':'🐾';
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
function gallery(a){const p=(a.photos||[]).filter(Boolean);if(!p.length)return '<div class="big-icon">'+icon(a.species)+'</div>';return '<div class="detail-gallery"><div class="main-photo"><img id="mainPhoto" src="'+esc(p[0])+'" alt="'+esc(a.name)+'" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="photo-fallback">'+icon(a.species)+'</div></div>'+(p.length>1?'<div class="photo-grid">'+p.map((x,i)=>'<button type="button" class="thumb '+(i===0?'active':'')+'" data-src="'+esc(x)+'"><img src="'+esc(x)+'" alt="Фото '+(i+1)+'" loading="lazy" referrerpolicy="no-referrer"></button>').join('')+'</div>':'')+'</div>'}
async function load(){try{const r=await fetch('/api/animals/'+encodeURIComponent(ID));const d=await r.json();if(!r.ok)throw new Error(d.detail||'not found');const a=d.animal,s=d.shelter||{};document.title=clean(a.name)+' — Дом для хвоста';document.querySelector('#page').innerHTML='<div class="animal-detail">'+gallery(a)+'<div><div class="eyebrow">ИЩЕТ ДОМ</div><h1>'+esc(a.name||'Без имени')+'</h1><div class="chips"><span>'+species(a.species)+'</span><span>'+esc(a.age||'Возраст не указан')+'</span><span>'+sex(a.sex)+'</span>'+(a.breed?'<span>'+esc(a.breed)+'</span>':'')+(a.size?'<span>'+({small:'Маленький',medium:'Средний',large:'Крупный'}[a.size]||esc(a.size))+'</span>':'')+(a.color?'<span>'+esc(a.color)+'</span>':'')+(a.sterilized===true?'<span>Стерилизован(а)</span>':'')+(a.vaccinated===true?'<span>Привит(а)</span>':'')+'</div><p class="lead">'+esc(a.description||'Описание отсутствует в источнике.')+'</p><div class="source-box"><b>🏠 Приют</b><a href="/shelters/'+encodeURIComponent(s.id||'')+'">'+esc(s.name||'Приют')+'</a><span>'+esc(s.city||s.region||'Москва и МО')+'</span></div>'+(a.original_url?'<a class="button" target="_blank" rel="noopener noreferrer" href="'+esc(a.original_url)+'">Оригинальное объявление ↗</a>':'')+'</div></div>';document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{const img=document.querySelector('#mainPhoto');img.style.display='block';img.src=b.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}catch(e){console.error(e);document.querySelector('#page').innerHTML='<div class="empty error-box">Анкета не найдена или временно недоступна.<br><a href="/">Вернуться в каталог</a></div>'}}
load();
</script></body></html>
